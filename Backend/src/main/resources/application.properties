spring.application.name=ITISAcademy
server.port=${SERVER_PORT:8080}
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/itis_academy}
spring.datasource.username=${POSTGRES_USER:itis}
spring.datasource.password=${POSTGRES_PASSWORD:academyforitis2026}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
server.tomcat.max-http-form-post-size=1073741824
server.tomcat.max-swallow-size=-1

jwt.secret=${JWT_SECRET:academyforitis2026academyforitis2026academyforitis2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:None}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:example@gmail.com}
spring.mail.password=${SMTP_PASSWORD:examplepassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${EMAIL_FROM:noreply@itisacademy.com}

app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.rate-limit.max=${OTP_RATE_LIMIT_MAX:3}
app.otp.rate-limit.window-minutes=${OTP_RATE_LIMIT_WINDOW_MINUTES:15}

storage.endpoint=${MINIO_ENDPOINT}
storage.access-key=${MINIO_ACCESS_KEY}
storage.secret-key=${MINIO_SECRET_KEY}
storage.region=${MINIO_REGION:ap-southeast-1}
storage.bucket=${MINIO_BUCKET}
storage.cdn-url=${CDN_URL:${MINIO_URL}}
storage.public-url=${MINIO_URL}

# HLS video transcode worker (Redis queue + FFmpeg)
# Flow: upload → DB PROCESSING → enqueue Redis → worker FFmpeg → READY/ERROR (FE polls/WS)
video.transcode.queue-key=${VIDEO_TRANSCODE_QUEUE_KEY:video:transcode}
video.transcode.worker-enabled=${VIDEO_TRANSCODE_WORKER_ENABLED:true}
video.transcode.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
video.transcode.ffprobe-path=${FFPROBE_PATH:ffprobe}
video.transcode.work-dir=${VIDEO_TRANSCODE_WORK_DIR:/tmp/itis-transcode}
video.transcode.block-timeout-seconds=${VIDEO_TRANSCODE_BLOCK_TIMEOUT_SECONDS:5}
video.transcode.ffmpeg-threads=${VIDEO_TRANSCODE_FFMPEG_THREADS:1}
video.transcode.x264-preset=${VIDEO_TRANSCODE_X264_PRESET:veryfast}
video.transcode.nice-enabled=${VIDEO_TRANSCODE_NICE_ENABLED:true}
video.transcode.nice-value=${VIDEO_TRANSCODE_NICE_VALUE:19}
video.transcode.ionice-enabled=${VIDEO_TRANSCODE_IONICE_ENABLED:true}
video.transcode.ionice-class=${VIDEO_TRANSCODE_IONICE_CLASS:2}
video.transcode.ionice-level=${VIDEO_TRANSCODE_IONICE_LEVEL:7}
