        - createIndex:
            tableName: quizzes
            indexName: idx_quizzes_is_published
            columns:
              - column:
                  name: is_published
        - addForeignKeyConstraint:
            baseTableName: quizzes
            baseColumnNames: topic_id
            referencedTableName: quiz_topics
            referencedColumnNames: id
            constraintName: fk_quizzes_topic_id
